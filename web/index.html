<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eserciari</title>
<meta name="description" content="Qui trovi gli eserciziari preparati per te.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f8fc;
    --grid: #dde5f1;
    --ink: #1b2a4a;
    --ink-soft: #55627d;
    --margin: #d64545;
    --accent: #2f5bea;
    --accent-ink: #ffffff;
    --row: #ffffff;
    --row-border: #d3dceb;
    --head: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141a2b;
      --grid: #1f2841;
      --ink: #e8edf8;
      --ink-soft: #97a3bf;
      --margin: #ff7a7a;
      --accent: #7b9cff;
      --accent-ink: #0f1526;
      --row: #1a2136;
      --row-border: #2a3452;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--body);
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    line-height: 1.5;
  }

  .page {
    max-width: 980px;
    margin: 0 auto;
    padding: 3.5rem 1.25rem 4rem;
    position: relative;
  }
  .page::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: 0.6rem;
    width: 2px;
    background: var(--margin);
    opacity: .55;
  }

  header { margin-bottom: 2rem; padding-left: 1rem; }
  h1 {
    font-family: var(--head);
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 .5rem;
  }
  .sub { margin: 0; color: var(--ink-soft); font-size: 1.05rem; max-width: 52ch; }

  .search { margin: 0 0 1.75rem 1rem; max-width: 520px; }
  .search input {
    width: 100%;
    font: inherit;
    padding: .7rem .95rem;
    color: var(--ink);
    background: var(--row);
    border: 1.5px solid var(--row-border);
    border-radius: 8px;
  }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .griglia {
    list-style: none;
    margin: 0 0 0 1rem;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.25rem;
  }
  @media (max-width: 480px) {
    .griglia { grid-template-columns: repeat(2, 1fr); gap: .85rem; }
  }
  .griglia > li[hidden] { display: none; }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--row);
    border: 1.5px solid var(--row-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .thumb {
    display: block;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.414;
    background: #ffffff;
    border-bottom: 1.5px solid var(--row-border);
    overflow: hidden;
  }
  .thumb canvas { display: block; width: 100%; height: 100%; }
  .thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  /* segnaposto mentre carica / se non riesce */
  .thumb::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0 22px, #e6ecf6 22px 23px);
    opacity: .8;
  }
  .thumb.pronta::after { display: none; }
  .thumb.errore::after { content: "PDF"; display: grid; place-items: center; background: #eef2f9; color: #55627d; font-weight: 700; font-size: 1.4rem; opacity: 1; }

  .info { padding: .75rem .85rem .85rem; display: flex; flex-direction: column; gap: .6rem; flex: 1; }
  .name {
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .name a { color: var(--ink); text-decoration: none; }
  .name a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .name a:focus-visible, .dl:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .azioni { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .size { color: var(--ink-soft); font-size: .85rem; white-space: nowrap; }
  .dl {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: .9rem;
    text-decoration: none;
    padding: .4rem .8rem;
    border-radius: 6px;
    white-space: nowrap;
  }
  .dl:hover { filter: brightness(1.1); }

  .empty {
    margin-left: 1rem;
    padding: 1.1rem 1.25rem;
    background: var(--row);
    border: 1.5px dashed var(--row-border);
    border-radius: 8px;
    color: var(--ink-soft);
  }
  .empty[hidden] { display: none; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; }

  footer { margin: 3rem 0 0 1rem; color: var(--ink-soft); font-size: .85rem; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Eserciari</h1>
    <p class="sub">Qui trovi gli eserciziari preparati per te.</p>
  </header>

  <div class="search">
    <input id="cerca" type="search" placeholder="Cerca un eserciziario" aria-label="Cerca un eserciziario" autocomplete="off">
  </div>

  <main>
    <ul class="griglia" id="griglia"></ul>
    <div class="empty" id="vuoto" hidden aria-live="polite"></div>
  </main>

  <footer id="aggiornato"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var griglia = document.getElementById("griglia");
  var vuoto = document.getElementById("vuoto");
  var cerca = document.getElementById("cerca");
  var aggiornato = document.getElementById("aggiornato");
  var carte = [];

  var pdfjs = window["pdfjs-dist/build/pdf"];
  if (pdfjs) {
    pdfjs.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  function norm(s) {
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function mostraVuoto(html) {
    vuoto.innerHTML = html;
    vuoto.hidden = false;
  }

  /* --- anteprima della prima pagina (una alla volta, solo quando la carta e' visibile) --- */
  var coda = [], attivi = 0, MAX_ATTIVI = 2;

  function avanza() {
    while (attivi < MAX_ATTIVI && coda.length) {
      attivi++;
      disegna(coda.shift()).then(function () { attivi--; avanza(); });
    }
  }

  function disegna(job) {
    var box = job.box, doc = null;
    if (!pdfjs) { box.classList.add("errore"); return Promise.resolve(); }
    return pdfjs.getDocument(job.url).promise
      .then(function (pdf) { doc = pdf; return pdf.getPage(1); })
      .then(function (page) {
        var base = page.getViewport({ scale: 1 });
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var larghezza = (box.clientWidth || 220) * dpr;
        var vp = page.getViewport({ scale: larghezza / base.width });
        var canvas = document.createElement("canvas");
        canvas.width = Math.floor(vp.width);
        canvas.height = Math.floor(vp.height);
        box.style.aspectRatio = base.width + " / " + base.height;
        return page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise
          .then(function () {
            box.appendChild(canvas);
            box.classList.add("pronta");
          });
      })
      .catch(function () { box.classList.add("errore"); })
      .then(function () { if (doc) doc.destroy(); });
  }

  var osservatore = "IntersectionObserver" in window
    ? new IntersectionObserver(function (voci) {
        voci.forEach(function (v) {
          if (v.isIntersecting) {
            osservatore.unobserve(v.target);
            coda.push({ box: v.target, url: v.target.getAttribute("href") });
          }
        });
        avanza();
      }, { rootMargin: "300px" })
    : null;

  /* --- costruzione della griglia (una volta sola) --- */
  function costruisci(files) {
    files.forEach(function (f) {
      var li = el("li", "card");

      var thumb = el("a", "thumb");
      thumb.href = f.url;
      thumb.target = "_blank";
      thumb.rel = "noopener";
      thumb.setAttribute("aria-label", "Apri " + f.title);
      li.appendChild(thumb);

      var info = el("div", "info");
      var nome = el("div", "name");
      var a = el("a", null, f.title);
      a.href = f.url;
      a.target = "_blank";
      a.rel = "noopener";
      nome.appendChild(a);
      info.appendChild(nome);

      var azioni = el("div", "azioni");
      azioni.appendChild(el("span", "size", f.size));
      var dl = el("a", "dl", "Scarica");
      dl.href = f.url;
      dl.setAttribute("download", "");
      dl.setAttribute("aria-label", "Scarica " + f.title);
      azioni.appendChild(dl);
      info.appendChild(azioni);

      li.appendChild(info);
      griglia.appendChild(li);

      carte.push({ li: li, testo: norm(f.title + " " + (f.category || "")) });

      if (osservatore) osservatore.observe(thumb);
      else coda.push({ box: thumb, url: f.url });
    });
    avanza();
  }

  function filtra() {
    var q = norm(cerca.value.trim());
    var trovati = 0;
    carte.forEach(function (c) {
      var mostra = !q || c.testo.indexOf(q) !== -1;
      c.li.hidden = !mostra;
      if (mostra) trovati++;
    });
    if (carte.length && !trovati) {
      mostraVuoto("Nessun risultato per “" + cerca.value.replace(/</g, "&lt;") + "”. Prova con un'altra parola.");
    } else {
      vuoto.hidden = true;
    }
  }

  fetch("pdfs.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var files = data.files || [];
      if (!files.length) {
        mostraVuoto("Nessun PDF trovato. Aggiungi i PDF al progetto e lancia <code>node genera-sito.js</code>.");
        return;
      }
      if (data.generated) {
        aggiornato.textContent = "Ultimo aggiornamento: " +
          new Date(data.generated).toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
      }
      costruisci(files);
    })
    .catch(function () {
      mostraVuoto("Non riesco a caricare l'elenco dei file. Controlla che <code>pdfs.json</code> sia presente accanto a <code>index.html</code>.");
    });

  cerca.addEventListener("input", filtra);
})();
</script>
</body>
</html>
